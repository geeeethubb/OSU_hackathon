# Paired native timings of whole images on Intel runners only (diagnostics, labelled native).
#
# Builds two commits with the root Dockerfile, each from its own exact
# source: the prior F12 9226397 and the candidate (writer cursor loaded early). Their /pipeline binaries are copied
# out and run natively, 4 threads pinned to CPUs 0-3, warm page cache, on 20M
# seeds 2, 3 and 5. Per seed, six interleaved pairs in the balanced order
# AB BA BA AB AB BA, with A = the prior, for: the candidate against F12, and F12
# against itself (A/A). Each run: fresh output folder, sync before it, then its
# in-process total (SS_TIMING stage=total) and its process wall clock.
# A job that does not land on an Intel CPU stops at once.
#
# Runs on a push to a branch named perf-probe*, which ci.yml ignores.
name: Perf probe

on:
  push:
    branches: ['perf-probe*']

env:
  TOOLS_KEY: ss-tools-v2
  PRIOR: 9226397b7dbf45f2b70a3b4ca2b2961eb2c2fbac
  C1: 22108d34e8f60027a931fd4a024818eded6807ec

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Intel only
        id: cpu
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CPU: $model"
          if lscpu | grep -q GenuineIntel; then echo "intel=1" >> "$GITHUB_OUTPUT"; else echo "not Intel: nothing to do"; fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.intel == '1'
      - name: Restore generator and dev answer
        if: steps.cpu.outputs.intel == '1'
        uses: actions/cache/restore@v4
        with:
          path: ~/ss-tools
          key: ${{ env.TOOLS_KEY }}
      - name: Generator, three scored builds
        if: steps.cpu.outputs.intel == '1'
        run: |
          bash bench/fetch_tools.sh "$HOME/ss-tools"
          for name in PRIOR C1; do
            sha="${!name}"
            git fetch -q --depth=1 origin "$sha"
            git worktree add -q --detach "$RUNNER_TEMP/src_$name" "$sha"
            tag="ss-$(echo "$name" | tr 'A-Z' 'a-z')"
            docker build -q -t "$tag" "$RUNNER_TEMP/src_$name" >/dev/null
            id=$(docker create "$tag")
            docker cp "$id:/pipeline" "$RUNNER_TEMP/pipeline_$name"
            docker rm "$id" >/dev/null
            echo "$name $sha $(sha256sum "$RUNNER_TEMP/pipeline_$name" | cut -c1-16)"
          done
          lscpu | grep -E "Model name|Thread|Core|L2|L3"
      - name: Paired runs
        if: steps.cpu.outputs.intel == '1'
        run: |
          cat > "$RUNNER_TEMP/pairs.py" <<'PYEOF'
          import os, re, statistics, subprocess, sys, time
          W = os.environ["RUNNER_TEMP"]
          ORDER = ["AB", "BA", "BA", "AB", "AB", "BA"]
          COMPARISONS = [("C1", "PRIOR"), ("PRIOR", "PRIOR")]

          def run(data, image):
              out = f"{W}/out"
              subprocess.run(["rm", "-rf", out], check=True)
              os.makedirs(out)
              subprocess.run(["sync"], check=True)
              env = dict(os.environ, DATA_DIR=data, OUTPUT_DIR=out, SCRATCH_DIR=out, NCPU="4", SS_TIMING="1")
              start = time.perf_counter_ns()
              p = subprocess.run(["taskset", "-c", "0-3", f"{W}/pipeline_{image}"], env=env, capture_output=True, text=True)
              wall = (time.perf_counter_ns() - start) / 1e6
              m = re.search(r"stage=total ms=([\d.]+)", p.stderr)
              ok = p.returncode == 0 and os.listdir(f"{out}/user_daily") and os.listdir(f"{out}/campaign_daily")
              if not ok:
                  print(f"RUN FAILED {image} rc={p.returncode} {p.stderr[-500:]}")
              return float(m.group(1)) if m else float("nan"), wall

          for seed in sys.argv[1:]:
              data = f"{W}/data_{seed}"
              subprocess.run([f"{os.environ['HOME']}/ss-tools/generate", "--seed", seed, "--events", "20000000",
                              "--clicks", "5000000", "--output", data], check=True, capture_output=True)
              subprocess.run(f"find {data} -type f -exec cat {{}} + > /dev/null", shell=True, check=True)
              for image in ("PRIOR", "C1"):
                  run(data, image)  # first touch of each binary, not counted
              for cand, prior in COMPARISONS:
                  saved = []
                  name = "A/A F12" if cand == prior else "hoist against F12"
                  print(f"seed {seed} {name} (A = F12, B = {cand}): in-process ms, wall ms")
                  for i, order in enumerate(ORDER):
                      res = {}
                      for label in order:
                          res[label] = run(data, prior if label == "A" else cand)
                      a, b = res["A"], res["B"]
                      saved.append(a[0] - b[0])
                      print(f"  pair {i+1} {order}: A {a[0]:8.1f} ({a[1]:7.1f})  B {b[0]:8.1f} ({b[1]:7.1f})  saved A-B {a[0]-b[0]:+7.1f}")
                  print(f"  SUMMARY seed {seed} {name}: median saved (A-B) {statistics.median(saved):+.1f} ms; B faster in {sum(s > 0 for s in saved)}/6 pairs")
              subprocess.run(["rm", "-rf", data], check=True)
          PYEOF
          python3 "$RUNNER_TEMP/pairs.py" 2 3 5
