# Paired native timings on Intel runners only (diagnostics, labelled native).
#
# Two images from the root Dockerfile, each from its exact source: the prior
# F11 and the candidate with two-word link-table entries. Their /pipeline
# binaries run natively, 4 threads pinned to CPUs 0-3, warm page cache, on 20M
# seeds 2, 3 and 5. Per seed, six interleaved pairs in the balanced order
# AB BA BA AB AB BA for: candidate against F11 (whole images), candidate default
# (spread 4) against SS_LINK_SPREAD=2 and against SS_LINK_SPREAD=8 (one image),
# and the candidate against itself (A/A). Per run: in-process total, wall,
# cpu_dedup_forward and cpu_click_map. A job off Intel stops at once.
#
# Runs on a push to a branch named perf-probe*, which ci.yml ignores.
name: Perf probe

on:
  push:
    branches: ['perf-probe*']

env:
  TOOLS_KEY: ss-tools-v2
  PRIOR: af07f594ceaf007cd2cab5c1224f7a21d5d8c889
  CAND: 411762083c08c0f70c76c6cd135863faa4b7629d

jobs:
  pairs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Intel only
        id: cpu
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CPU: $model"
          if lscpu | grep -q GenuineIntel; then echo "intel=1" >> "$GITHUB_OUTPUT"; else echo "not Intel: nothing to do"; fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.intel == '1'
      - name: Restore generator and dev answer
        if: steps.cpu.outputs.intel == '1'
        uses: actions/cache/restore@v4
        with:
          path: ~/ss-tools
          key: ${{ env.TOOLS_KEY }}
      - name: Generator, two scored builds
        if: steps.cpu.outputs.intel == '1'
        run: |
          bash bench/fetch_tools.sh "$HOME/ss-tools"
          for name in PRIOR CAND; do
            sha="${!name}"
            tag="ss-$(echo "$name" | tr 'A-Z' 'a-z')"
            git fetch -q --depth=1 origin "$sha"
            git worktree add -q --detach "$RUNNER_TEMP/src_$name" "$sha"
            docker build -q -t "$tag" "$RUNNER_TEMP/src_$name" >/dev/null
            id=$(docker create "$tag")
            docker cp "$id:/pipeline" "$RUNNER_TEMP/pipeline_$name"
            docker rm "$id" >/dev/null
            echo "$name $sha $(sha256sum "$RUNNER_TEMP/pipeline_$name" | cut -c1-16)"
          done
          lscpu | grep -E "Model name|Thread|Core|L2|L3"
      - name: Paired runs
        if: steps.cpu.outputs.intel == '1'
        run: |
          cat > "$RUNNER_TEMP/pairs.py" <<'PYEOF'
          import os, re, statistics, subprocess, sys, time
          W = os.environ["RUNNER_TEMP"]
          ORDER = ["AB", "BA", "BA", "AB", "AB", "BA"]
          # (name, A = (image, env), B = (image, env))
          COMPARISONS = [
              ("cand_vs_F11", ("PRIOR", {}), ("CAND", {})),
              ("spread2", ("CAND", {}), ("CAND", {"SS_LINK_SPREAD": "2"})),
              ("spread8", ("CAND", {}), ("CAND", {"SS_LINK_SPREAD": "8"})),
              ("aa", ("CAND", {}), ("CAND", {})),
          ]

          def run(data, image, extra):
              out = f"{W}/out"
              subprocess.run(["rm", "-rf", out], check=True)
              os.makedirs(out)
              subprocess.run(["sync"], check=True)
              env = dict(os.environ, DATA_DIR=data, OUTPUT_DIR=out, SCRATCH_DIR=out, NCPU="4", SS_TIMING="1", **extra)
              start = time.perf_counter_ns()
              p = subprocess.run(["taskset", "-c", "0-3", f"{W}/pipeline_{image}"], env=env, capture_output=True, text=True)
              wall = (time.perf_counter_ns() - start) / 1e6
              def num(pattern):
                  m = re.search(pattern, p.stderr)
                  return float(m.group(1)) if m else float("nan")
              ok = p.returncode == 0 and os.listdir(f"{out}/user_daily") and os.listdir(f"{out}/campaign_daily")
              if not ok:
                  print(f"RUN FAILED {image} {extra} rc={p.returncode} {p.stderr[-500:]}")
              return (num(r"stage=total ms=([\d.]+)"), wall, num(r"detail=cpu_dedup_forward ms=([\d.]+)"),
                      num(r"detail=cpu_click_map ms=([\d.]+)"))

          for seed in sys.argv[1:]:
              data = f"{W}/data_{seed}"
              subprocess.run([f"{os.environ['HOME']}/ss-tools/generate", "--seed", seed, "--events", "20000000",
                              "--clicks", "5000000", "--output", data], check=True, capture_output=True)
              subprocess.run(f"find {data} -type f -exec cat {{}} + > /dev/null", shell=True, check=True)
              for image in ("PRIOR", "CAND"):
                  run(data, image, {})  # first touch of each binary, not counted
              for name, A, B in COMPARISONS:
                  print(f"seed {seed} {name} (A = {A[0]} {A[1] or ''}, B = {B[0]} {B[1] or ''}): total, wall, forward, click map")
                  saved, fa, fb = [], [], []
                  for i, order in enumerate(ORDER):
                      res = {}
                      for label in order:
                          image, extra = A if label == "A" else B
                          res[label] = run(data, image, extra)
                      a, b = res["A"], res["B"]
                      saved.append(a[0] - b[0]); fa.append(a[2] + a[3]); fb.append(b[2] + b[3])
                      print(f"  pair {i+1} {order}: A {a[0]:8.1f} fwd {a[2]:6.1f} map {a[3]:6.1f} | B {b[0]:8.1f} fwd {b[2]:6.1f} map {b[3]:6.1f} | saved A-B {a[0]-b[0]:+7.1f}")
                  fwa, fwb = statistics.median(fa), statistics.median(fb)
                  print(f"  SUMMARY seed {seed} {name}: median total saved (A-B) {statistics.median(saved):+.1f} ms, B faster in {sum(s > 0 for s in saved)}/6; "
                        f"forward+click map {fwa:.1f} -> {fwb:.1f} ({100 * (fwb / fwa - 1):+.1f}%)")
              subprocess.run(["rm", "-rf", data], check=True)
          PYEOF
          python3 "$RUNNER_TEMP/pairs.py" 2 3 5
