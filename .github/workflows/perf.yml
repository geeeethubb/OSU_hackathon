# Hardware-counter probe of the scored build (diagnostics only, never a ranking).
#
# Builds the root Dockerfile exactly as the scorer does (PGO profile included),
# copies /pipeline out of the image and runs it natively on 20M seed 2 under
# `perf`, pinned with taskset, input page cache warm:
#   - perf stat of whole runs: 4 threads on CPUs 0-3, 2 threads on one core's
#     two hyperthreads, 2 threads on two cores, 1 thread;
#   - perf record of a 4-thread run with cycles, instructions and branch
#     misses grouped, reported per function (per-phase IPC and where the
#     kernel's time goes: page faults, teardown).
# The outputs are compared with /reference's only by row counts here; this job
# times nothing that is used to choose between commits.
#
# Runs on a push to a branch named perf-probe*, which ci.yml ignores.
name: Perf probe

on:
  push:
    branches: ['perf-probe*']

env:
  TOOLS_KEY: ss-tools-v2

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore generator and dev answer
        uses: actions/cache/restore@v4
        with:
          path: ~/ss-tools
          key: ${{ env.TOOLS_KEY }}
      - name: Generator and dev answer (from the track page when not cached)
        run: bash bench/fetch_tools.sh "$HOME/ss-tools"
      - name: Data (20M events, seed 2)
        run: |
          "$HOME/ss-tools/generate" --seed 2 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/data"
          du -sb "$RUNNER_TEMP/data"/* | sort -k2
          for d in events clicks links; do printf '%s rows (with headers): ' $d; cat "$RUNNER_TEMP/data/$d"/*.csv | wc -l; done
      - name: Scored build (root Dockerfile), binary copied out
        run: |
          docker build -q -t ss-probe .
          id=$(docker create ss-probe)
          docker cp "$id:/pipeline" "$RUNNER_TEMP/pipeline"
          docker rm "$id" >/dev/null
          sha256sum "$RUNNER_TEMP/pipeline"
      - name: perf
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" >/dev/null 2>&1 \
            || sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null 2>&1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -n 1)
          [ -x "$PERF" ] || PERF=$(command -v perf)
          echo "perf: $PERF"; "$PERF" --version || true
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 >/dev/null
          lscpu
          for c in 0 1 2 3; do echo "cpu$c siblings $(cat /sys/devices/system/cpu/cpu$c/topology/thread_siblings_list) core $(cat /sys/devices/system/cpu/cpu$c/topology/core_id)"; done
          cat /sys/kernel/mm/transparent_hugepage/enabled
          "$PERF" list hw cache 2>/dev/null | head -n 40 || true
          W="$RUNNER_TEMP"
          find "$W/data" -type f -exec cat {} + > /dev/null
          siblings=$(cat /sys/devices/system/cpu/cpu0/topology/thread_siblings_list)
          other=$(for c in 1 2 3; do s=$(cat /sys/devices/system/cpu/cpu$c/topology/thread_siblings_list); [ "$s" != "$siblings" ] && echo $c && break; done)
          echo "one core: $siblings; two cores: 0,$other"
          EVENTS=cycles,instructions,branches,branch-misses,L1-dcache-loads,L1-dcache-load-misses,LLC-loads,LLC-load-misses,dTLB-loads,dTLB-load-misses,page-faults,task-clock,context-switches,cpu-migrations
          one() {
            local label="$1" cpus="$2" threads="$3"; shift 3
            rm -rf "$W/out" && mkdir -p "$W/out"
            echo "=== $label (taskset $cpus, NCPU=$threads)"
            env DATA_DIR="$W/data" OUTPUT_DIR="$W/out" SCRATCH_DIR="$W/out" NCPU="$threads" SS_TIMING=1 "$@" \
              "$PERF" stat -x, -e "$EVENTS" -o "$W/stat_$label.csv" -- taskset -c "$cpus" "$W/pipeline" 2> "$W/err_$label.txt" || true
            grep -E "stage=|cpu_|links_build|phase" "$W/err_$label.txt" | sed 's/SS_TIMING //' | tr '\n' ' '; echo
            grep -v '^#' "$W/stat_$label.csv" | grep -v '^$'
            for t in user_daily campaign_daily; do printf '%s files: ' $t; ls "$W/out/$t" | wc -l; done
          }
          for threads in 4; do
            cpus=0-3
            for round in 1; do
              echo "=== cpu-clock profile, NCPU=$threads, taskset $cpus, round $round"
              rm -rf "$W/out" && mkdir -p "$W/out"
              env DATA_DIR="$W/data" OUTPUT_DIR="$W/out" SCRATCH_DIR="$W/out" NCPU=$threads SS_TIMING=1 \
                "$PERF" record -F 9999 -e cpu-clock -o "$W/clock.data" -- taskset -c $cpus "$W/pipeline" 2> "$W/rec.txt" || true
              grep -E "stage=total|samples" "$W/rec.txt" | paste -sd' '
              "$PERF" report -i "$W/clock.data" --stdio --no-children --sort dso,symbol --percent-limit 0.25 2>&1 | grep -v "^#" | grep -v "^$" | head -n 40
              for sym in 'ss::fast::simd::event_lean_long::<0>' 'ss::fast::run_once::{closure#10}' 'ss::fast::parse::events_assembly_run_codes'; do
                echo "=== annotate $sym: hottest instructions (percent of the function's samples)"
                "$PERF" annotate -i "$W/clock.data" --stdio --no-source "$sym" 2>/dev/null \
                  | grep -E '^ +[0-9]+\.[0-9]+ +:' | sort -t: -k1,1 -rn | head -n 45
              done
            done
          done
          mkdir -p "$W/probe" && cp "$W"/stat_*.csv "$W"/err_*.txt "$W/probe/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-probe
          path: ${{ runner.temp }}/probe
