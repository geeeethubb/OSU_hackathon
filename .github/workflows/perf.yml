# Thread scaling of F14 on Intel runners only (diagnostics, labelled native).
#
# Builds F14 (68f5f76) with the root Dockerfile, copies /pipeline out and runs it
# natively on 20M seed 2, warm page cache, in four placements: 1 thread; 2
# threads on 2 cores; 2 threads on 1 core (hyperthread siblings); 4 threads on
# 2 cores x 2. Sibling CPUs are read from sysfs, not assumed. Three rounds per
# placement, interleaved. Each run prints its SS_TIMING stage, phase (wall,
# first and last done, idle thread-ms) and detail lines.
# A job that does not land on an Intel CPU stops at once.
#
# Ten jobs per push (two runner labels, five copies each).
# Runs on a push to a branch named perf-probe*, which ci.yml ignores.
name: Perf probe

on:
  push:
    branches: ['perf-probe*']

env:
  TOOLS_KEY: ss-tools-v2
  F14: 68f5f76b6f364e38a584728968f02a907d33e66e

jobs:
  scaling:
    name: scaling ${{ matrix.os }} ${{ matrix.copy }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04]
        copy: [1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Intel only
        id: cpu
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CPU: $model"
          if lscpu | grep -q GenuineIntel; then
            echo "intel=1" >> "$GITHUB_OUTPUT"
          else
            echo "not Intel: nothing to do"
          fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.intel == '1'
      - name: Restore generator and dev answer
        if: steps.cpu.outputs.intel == '1'
        uses: actions/cache/restore@v4
        with:
          path: ~/ss-tools
          key: ${{ env.TOOLS_KEY }}
      - name: Generator, data, scored build
        if: steps.cpu.outputs.intel == '1'
        run: |
          bash bench/fetch_tools.sh "$HOME/ss-tools"
          "$HOME/ss-tools/generate" --seed 2 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/data"
          git fetch -q --depth=1 origin "$F14"
          git worktree add -q --detach "$RUNNER_TEMP/src_f14" "$F14"
          docker build -q -t ss-f14 "$RUNNER_TEMP/src_f14" >/dev/null
          id=$(docker create ss-f14)
          docker cp "$id:/pipeline" "$RUNNER_TEMP/pipeline"
          docker rm "$id" >/dev/null
          echo "F14 $F14 $(sha256sum "$RUNNER_TEMP/pipeline" | cut -c1-16)"
          lscpu | grep -E "Model name|Thread|Core|Socket|L1d|L2|L3"
          for c in 0 1 2 3; do echo "cpu$c siblings $(cat /sys/devices/system/cpu/cpu$c/topology/thread_siblings_list)"; done
      - name: Scaling runs
        if: steps.cpu.outputs.intel == '1'
        run: |
          W="$RUNNER_TEMP"
          find "$W/data" -type f -exec cat {} + > /dev/null
          # The sibling of CPU 0 (lists look like "0,2" or "0-1"), and a CPU on another core.
          sibs=$(tr ',-' '  ' < /sys/devices/system/cpu/cpu0/topology/thread_siblings_list)
          smt=$(echo $sibs | awk '{print $2}')
          other=""
          for c in 1 2 3; do
            case " $sibs " in *" $c "*) ;; *) other=$c; break ;; esac
          done
          echo "placements: smt pair 0,$smt; two cores 0,$other"
          run() {
            rm -rf "$W/out" && mkdir -p "$W/out" && sync
            env DATA_DIR="$W/data" OUTPUT_DIR="$W/out" SCRATCH_DIR="$W/out" NCPU="$2" SS_TIMING=1 \
              taskset -c "$1" "$W/pipeline" 2> "$W/err.txt" || echo "RUN FAILED $3"
            echo "$3 $(grep -E 'stage=|phase |detail=' "$W/err.txt" | sed 's/SS_TIMING //' | paste -sd' ')"
          }
          run 0-3 4 warmup > /dev/null
          for round in 1 2 3; do
            run 0 1 "t1_r$round"
            [ -n "$other" ] && run "0,$other" 2 "t2cores_r$round"
            [ -n "$smt" ] && run "0,$smt" 2 "t2smt_r$round"
            run 0-3 4 "t4_r$round"
          done
