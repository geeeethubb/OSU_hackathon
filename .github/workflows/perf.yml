# cpu-clock profile of the scored build on a Xeon 8370C (Ice Lake) only (diagnostics).
#
# Root Dockerfile build, /pipeline copied out and run natively on 20M seed 2,
# 4 threads on CPUs 0-3, warm page cache, two recorded rounds at 9,999 Hz:
# round 1 the default (block recycling on), round 2 SS_RECYCLE=0.
# Reported: in-process stages, per-function shares (pipeline and kernel, 0.3%
# and up), and for every pipeline function at 1.5% or more its 8 hottest
# instructions, each with the 10 before it. Jobs on any other CPU stop at once.
#
# Runs on a push to a branch named perf-probe*, which ci.yml ignores.
name: Perf probe

on:
  push:
    branches: ['perf-probe*']

env:
  TOOLS_KEY: ss-tools-v2

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Xeon 8370C only
        id: cpu
        run: |
          model=$(lscpu | sed -n 's/^Model name: *//p')
          echo "CPU: $model"
          if echo "$model" | grep -q 8370C; then echo "go=1" >> "$GITHUB_OUTPUT"; else echo "not a Xeon 8370C: nothing to do"; fi
      - uses: actions/checkout@v4
        if: steps.cpu.outputs.go == '1'
      - name: Restore generator and dev answer
        if: steps.cpu.outputs.go == '1'
        uses: actions/cache/restore@v4
        with:
          path: ~/ss-tools
          key: ${{ env.TOOLS_KEY }}
      - name: Generator, data, scored build
        if: steps.cpu.outputs.go == '1'
        run: |
          bash bench/fetch_tools.sh "$HOME/ss-tools"
          "$HOME/ss-tools/generate" --seed 2 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/data"
          docker build -q -t ss-probe .
          id=$(docker create ss-probe)
          docker cp "$id:/pipeline" "$RUNNER_TEMP/pipeline"
          docker rm "$id" >/dev/null
          sha256sum "$RUNNER_TEMP/pipeline"
          lscpu | grep -E "Model name|Thread|Core|L1d|L2|L3"
      - name: perf
        if: steps.cpu.outputs.go == '1'
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" >/dev/null 2>&1 \
            || sudo apt-get install -y -qq linux-tools-common linux-tools-generic >/dev/null 2>&1 || true
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -n 1)
          [ -x "$PERF" ] || PERF=$(command -v perf)
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 >/dev/null
          W="$RUNNER_TEMP"
          find "$W/data" -type f -exec cat {} + > /dev/null
          for round in 1 2; do
            rm -rf "$W/out" && mkdir -p "$W/out"
            if [ $round = 1 ]; then setting=""; else setting="SS_RECYCLE=0"; fi
            echo "=== round $round ${setting:-default}"
            env $setting DATA_DIR="$W/data" OUTPUT_DIR="$W/out" SCRATCH_DIR="$W/out" NCPU=4 SS_TIMING=1 \
              "$PERF" record -F 9999 -e cpu-clock -o "$W/clock_$round.data" -- taskset -c 0-3 "$W/pipeline" 2> "$W/rec.txt" || true
            grep -E "stage=|cpu_|links_build" "$W/rec.txt" | sed 's/SS_TIMING //' | paste -sd' '
            "$PERF" report -i "$W/clock_$round.data" --stdio --no-children --sort dso,symbol --percent-limit 0.3 2>&1 | grep -E "^ +[0-9]" | head -n 60
          done
          syms=$("$PERF" report -i "$W/clock_1.data" --stdio --no-children --sort symbol --percent-limit 1.5 2>/dev/null \
            | grep -E "^ +[0-9]" | grep -v "\[k\]" | sed -E 's/^ +[0-9.]+% +\[\.\] +//; s/ +$//')
          while IFS= read -r sym; do
            [ -n "$sym" ] || continue
            "$PERF" annotate -i "$W/clock_1.data" --stdio --no-source "$sym" > "$W/ann.txt" 2>/dev/null || true
            echo "=== annotate $sym: the 8 hottest instructions, each with the 10 before it (round 1)"
            for at in $(awk '/^ +[0-9]+\.[0-9]+ +:/ {print $1 " " NR}' "$W/ann.txt" | sort -rn | head -n 8 | cut -d' ' -f2); do
              echo "- line $at"
              sed -n "$((at > 10 ? at - 10 : 1)),$((at + 1))p" "$W/ann.txt" | cut -c1-130
            done
          done <<< "$syms"
