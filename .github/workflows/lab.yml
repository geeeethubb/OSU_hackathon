# One-off measurement, branch exp-lab only: what one event row costs in the
# parse stage on a hosted runner, and how much of it is the variety of row
# formats. Nothing here is ranked or scored; the runs are not in containers.
name: parse-lab
on:
  push:
    branches: [exp-lab]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core|L1d|L2 cache|L3 cache" || true
          cat /sys/kernel/mm/transparent_hugepage/enabled
      - name: Tools
        run: |
          bash bench/fetch_tools.sh "$HOME/ss-tools"
          rustc -O bench/experiments/canon.rs -o "$RUNNER_TEMP/canon"
      - name: Build
        run: |
          docker buildx build --platform linux/amd64 --load -t ss-lab .
          cid=$(docker create ss-lab)
          docker cp "$cid:/pipeline" "$RUNNER_TEMP/pipeline"
          docker rm "$cid" >/dev/null
          chmod +x "$RUNNER_TEMP/pipeline"
      - name: Data (20M events, seed 2) in four formats
        run: |
          D="$RUNNER_TEMP/data"
          "$HOME/ss-tools/generate" --seed 2 --events 20000000 --clicks 5000000 --output "$D" >/dev/null
          for mode in q t a; do
            U="$RUNNER_TEMP/data-$mode"
            mkdir -p "$U"
            cp -al "$D/clicks" "$U/clicks"; cp -al "$D/links" "$U/links"
            cp "$D"/*.csv "$D"/manifest.json "$U"/
            "$RUNNER_TEMP/canon" "$D/events" "$U/events" "$mode" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "format $mode: $(du -sb "$U/events" | cut -f1) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          echo "original: $(du -sb "$D/events" | cut -f1) bytes, $(cat "$D"/events/*.csv | wc -l) lines" | tee -a "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP"/data*/events/*.csv "$D"/clicks/*.csv "$D"/links/*.csv > /dev/null
      - name: The outputs of the four formats are the same tables
        run: |
          P="$RUNNER_TEMP/pipeline"
          for mode in "" -q -t -a; do
            O="$RUNNER_TEMP/out$mode"; rm -rf "$O"; mkdir -p "$O"
            DATA_DIR="$RUNNER_TEMP/data$mode" OUTPUT_DIR="$O" SCRATCH_DIR="$O" NCPU=4 "$P"
          done
          python3 -m pip install -q pyarrow pandas >/dev/null 2>&1 || true
          for mode in -q -t -a; do
            python3 scripts/compare.py "$RUNNER_TEMP/out$mode" "$RUNNER_TEMP/out" | tail -n 1 | sed "s/^/format $mode against the original: /" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Runs
        run: |
          P="$RUNNER_TEMP/pipeline"; O="$RUNNER_TEMP/out-run"
          line() {  # label, then the environment and command prefix
            label="$1"; shift
            rm -rf "$O"; mkdir -p "$O"
            out=$( { env OUTPUT_DIR="$O" SCRATCH_DIR="$O" SS_TIMING=1 "$@" "$P" 2>&1 >/dev/null || true; } )
            parse=$(printf '%s\n' "$out" | sed -n 's/.*stage=parse ms=\([0-9.]*\).*/\1/p' | head -n 1)
            total=$(printf '%s\n' "$out" | sed -n 's/.*stage=total ms=\([0-9.]*\).*/\1/p' | head -n 1)
            ev=$(printf '%s\n' "$out" | sed -n 's/.*detail=cpu_parse_events ms=\([0-9.]*\).*/\1/p' | head -n 1)
            cl=$(printf '%s\n' "$out" | sed -n 's/.*detail=cpu_parse_clicks ms=\([0-9.]*\).*/\1/p' | head -n 1)
            note=$(printf '%s\n' "$out" | grep -o 'event_store_in_assembly=[a-z]*' | head -n 1)
            keys=$(printf '%s\n' "$out" | grep -c 'note=keys Some' || true)
            echo "$label | parse_stage=$parse cpu_events=$ev cpu_clicks=$cl total=$total keys=$keys $note"
          }
          for round in 1 2 3; do
            echo "== round $round"
            for mode in "" -q -t -a; do
              D="$RUNNER_TEMP/data$mode"; name="format ${mode:-original}"
              line "$name, DIAG=7, 1 thread          " DATA_DIR="$D" NCPU=1 SS_DIAG=7 taskset -c 0
              line "$name, DIAG=7, 4 threads         " DATA_DIR="$D" NCPU=4 SS_DIAG=7
              line "$name, DIAG=7 compiler, 1 thread " DATA_DIR="$D" NCPU=1 SS_DIAG=7 SS_KERNEL=plain taskset -c 0
              line "$name, DIAG=1, 4 threads         " DATA_DIR="$D" NCPU=4 SS_DIAG=1
              line "$name, full run, 4 threads       " DATA_DIR="$D" NCPU=4
            done
          done 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
