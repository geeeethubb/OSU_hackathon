# One-off calibration, branch exp-calib only: the officially scored commits timed
# on one runner in one job (20M events, seed 2), so that their official scores
# can be set against container times from a single machine. Not ranked.
name: calibration
on:
  push:
    branches: [exp-calib]
permissions:
  contents: read
jobs:
  calib:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Machine
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)|Thread|Core" || true
      - name: Tools and data
        run: |
          bash bench/fetch_tools.sh "$HOME/ss-tools"
          "$HOME/ss-tools/generate" --seed 2 --events 20000000 --clicks 5000000 --output "$RUNNER_TEMP/data" >/dev/null
          chmod -R a+rX "$RUNNER_TEMP/data"
          cat "$RUNNER_TEMP"/data/*/*.csv > /dev/null
      - name: Build the scored commits
        run: |
          for sha in e4eef020ce0bb9e005c329e57ea241c6e842dde8 23b285da8246d00275b1ad191da0fffb8c5f81e4 \
                     2b2cccd1ba1cb12bc5a074a899ce54c868205b86 4567e9532f4019fbfd0e92908fd01cc49f24f67d \
                     2dae9298f4e1e0a5259eec54c400501b00fae26f 9cb9ad6e3cd0d75f160cecae8005d1c6cb8a7c4e \
                     1033956062d3cd948462c664d822f2636bcf1153; do
            git cat-file -e "$sha^{commit}"
            mkdir -p "$RUNNER_TEMP/ctx-$sha"
            git archive "$sha" | tar -x -C "$RUNNER_TEMP/ctx-$sha"
            docker buildx build --platform linux/amd64 --load -t "scored:${sha:0:8}" "$RUNNER_TEMP/ctx-$sha" > "$RUNNER_TEMP/build-${sha:0:8}.log" 2>&1 \
              || { tail -20 "$RUNNER_TEMP/build-${sha:0:8}.log"; exit 1; }
            echo "built ${sha:0:8}"
          done
      - name: Time them, fresh container per run, shuffled rounds
        run: |
          python3 bench/experiments/calib.py "$RUNNER_TEMP/data" 6 \
            scored:e4eef020 scored:23b285da scored:2b2cccd1 scored:4567e953 scored:2dae9298 scored:9cb9ad6e scored:10339560 \
            | tee -a "$GITHUB_STEP_SUMMARY"
